name: Pursuit Maps Pipeline
on:
  schedule:
    - cron: '0 5 * * *'  # 5:00 AM UTC daily
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fetch feedback + MX -> Sheet (GAS)
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: |
          echo "Fetching feedback and syncing to Sheet..."
          python3 pipeline/pipeline.py --action sync
        timeout-minutes: 15

      - name: Update votes
        if: success()
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: python3 pipeline/pipeline.py --action votes

      - name: Generate report
        if: success()
        run: python3 pipeline/pipeline.py --action report

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/ vote_report.md missing_maps_report.md missing_maps.json 2>/dev/null
          git diff --cached --quiet || git commit -m "Pipeline update $(date -u +%Y-%m-%d-%H%M)"
          git push
