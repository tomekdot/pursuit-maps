name: Sheet Sync via GAS
on:
  schedule:
    - cron: '0 5 * * *'  # 5:00 AM UTC daily
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch feedback votes
        run: python3 scripts/vote_tracker.py

      - name: Send sync data to Sheet (GAS)
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: python3 gas-webapp/gas_runner.py --action sync

      - name: Send votes to Sheet (GAS)
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: python3 gas-webapp/gas_runner.py --action votes

      - name: Commit reports
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add vote_report.md vote_history.json feedback_full.json gas-webapp/gas_last_result.json 2>/dev/null
          git diff --cached --quiet || git commit -m "Sheet sync $(date -u +%Y-%m-%d-%H%M)"
          git push
