name: Vote Tracker
on:
  schedule:
    - cron: '0 5 * * *'  # 5:00 AM UTC daily
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check moon phase (full moon only)
        id: moon_check
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import os

          # Conway-style moon age approximation in days (0..29.53).
          # Full moon occurs around age 14.77, so we allow a tight tolerance.
          def moon_age(date):
              year = date.year
              month = date.month
              day = date.day

              if month < 3:
                  year -= 1
                  month += 12

              month += 1
              c = int(365.25 * year)
              e = int(30.6 * month)
              jd = c + e + day - 694039.09
              jd /= 29.5305882
              b = int(jd)
              jd -= b
              return jd * 29.5305882

          today = datetime.datetime.utcnow().date()
          age = moon_age(today)
          is_full = abs(age - 14.765) <= 1.0

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"is_full_moon={'true' if is_full else 'false'}\n")
              fh.write(f"moon_age={age:.2f}\n")

          print(f"Moon age: {age:.2f} days")
          print("Proceeding with vote tracker" if is_full else "Not full moon; skipping vote tracker")
          PY

      - name: Set up Python
        if: steps.moon_check.outputs.is_full_moon == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch votes and generate report
        if: steps.moon_check.outputs.is_full_moon == 'true'
        run: python3 scripts/vote_tracker.py

      - name: Commit report and history
        if: steps.moon_check.outputs.is_full_moon == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add vote_report.md vote_history.json
          git diff --cached --quiet || git commit -m "Vote report $(date -u +%Y-%m-%d-%H%M)"
          git push

      - name: Upload report
        if: steps.moon_check.outputs.is_full_moon == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vote-report-${{ github.run_number }}
          path: vote_report.md

      - name: Skip info (not full moon)
        if: steps.moon_check.outputs.is_full_moon != 'true'
        run: |
          echo "Skipped: this workflow runs only during full moon."
